<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbf7ef" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quelio - AI Quiz Generator</title>
    <script>
      // A saved Supabase session means the visitor is signed in: hide the prerendered landing page before it can flash.
      try {
        for (var i = 0; i < localStorage.length; i++) {
          if (/^sb-.+-auth-token$/.test(localStorage.key(i))) {
            document.documentElement.setAttribute('data-session', '1')
            break
          }
        }
      } catch (e) {}
    </script>
    <style>
      html[data-session] [data-landing-static] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
