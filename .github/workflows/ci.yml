name: CI

on:
  push:
    branches: [master, 'is/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels that branch's older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No real AI provider key is ever defined here: the tests use mocked providers and tests/guards fails the run if one is reached.
env:
  TZ: Europe/Istanbul
  CI: 'true'

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The same projects as `npm run test:e2e` (desktop + mobile, Chromium only); the dev server runs without HMR on the fake backend (see playwright.config.ts).
      - run: npx playwright test --project=desktop --project=mobile --shard=${{ matrix.shard }}/4 --workers=2 --reporter=dot,blob,json
      - if: always()
        run: node scripts/ci-summary.mjs results.json "e2e shard ${{ matrix.shard }}/4"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-e2e-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-e2e-${{ matrix.shard }}
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The shared TEST database allows one run at a time, across all branches; a waiting run is never cancelled.
    concurrency:
      group: supabase-test-db
      cancel-in-progress: false
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_TEST_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
      SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
    steps:
      - name: Require the SUPABASE_TEST_* secrets
        run: |
          if [ -z "$SUPABASE_TEST_URL" ] || [ -z "$SUPABASE_TEST_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_TEST_SECRET_KEY" ] || [ -z "$SUPABASE_TEST_PROJECT_REF" ]; then
            echo "::error::A SUPABASE_TEST_* secret is missing: the supabase suite cannot run (it is not skipped)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.supabase.config.ts --project=desktop --project=mobile --workers=2 --reporter=dot,blob,json
      - if: always()
        run: node scripts/ci-summary.mjs results.json "supabase"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-supabase
          path: blob-report
          retention-days: 14
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-supabase
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  # One HTML report and one total for every shard of every suite.
  report:
    needs: [e2e, supabase]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blobs
          merge-multiple: true
      - run: npx playwright merge-reports --config=playwright.merge.config.ts ./all-blobs
      # Printed to the log first (readable with `gh run view --log`), then written to the step summary page.
      - if: always()
        run: |
          env -u GITHUB_STEP_SUMMARY node scripts/ci-summary.mjs merged.json "TOTAL (all suites and shards)"
          node scripts/ci-summary.mjs merged.json "TOTAL (all suites and shards)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
