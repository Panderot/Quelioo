name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No real AI provider key is ever defined here: the tests use mocked providers and tests/guards fails the run if one is reached.
env:
  TZ: Europe/Istanbul
  CI: 'true'

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The same projects as `npm run test:e2e` (desktop + mobile, Chromium only); the dev server runs without HMR on the fake backend (see playwright.config.ts).
      - run: npx playwright test --project=desktop --project=mobile --shard=${{ matrix.shard }}/4 --workers=2 --reporter=dot,html
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_TEST_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
      SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
    steps:
      - id: secrets
        run: |
          if [ -n "$SUPABASE_TEST_URL" ] && [ -n "$SUPABASE_TEST_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_TEST_SECRET_KEY" ] && [ -n "$SUPABASE_TEST_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The SUPABASE_TEST_* secrets are not set: the game job is skipped."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        name: Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # `npm run test:game` (scripts/test-each.mjs) counts processes with PowerShell; in CI the same config runs directly, one worker.
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright test --config=playwright.game.config.ts --project=desktop --project=mobile --workers=1 --reporter=dot,html
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-game
          path: |
            playwright-report
            test-results
          retention-days: 7

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_TEST_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
      SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
    steps:
      - id: secrets
        run: |
          if [ -n "$SUPABASE_TEST_URL" ] && [ -n "$SUPABASE_TEST_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_TEST_SECRET_KEY" ] && [ -n "$SUPABASE_TEST_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The SUPABASE_TEST_* secrets are not set: the supabase job is skipped."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright test --config=playwright.supabase.config.ts --project=desktop --project=mobile --workers=2 --reporter=dot,html
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-supabase
          path: |
            playwright-report
            test-results
          retention-days: 7
